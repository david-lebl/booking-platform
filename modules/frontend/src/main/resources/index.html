<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PilatesBook – Fitness &amp; Pilates Booking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #212529; }
    a { color: #6c63ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 2rem; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-size: 1.4rem; font-weight: 700; color: #6c63ff; }
    .nav { display: flex; gap: 1.5rem; }
    .nav a { color: #495057; font-weight: 500; }
    .app-main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .page { }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; color: #212529; }
    .subtitle { color: #6c757d; margin-bottom: 1.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.5rem 1.25rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #6c63ff; color: #fff; }
    .btn-primary:hover { background: #5a52d5; color: #fff; text-decoration: none; }
    .btn-outline { background: transparent; border: 1.5px solid #6c63ff; color: #6c63ff; }
    .btn-outline:hover { background: #f0eeff; }
    .btn-disabled { background: #dee2e6; color: #adb5bd; cursor: not-allowed; }
    .schedule-filters { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
    .sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .class-card { background: #fff; border-radius: 12px; border: 1px solid #e9ecef; overflow: hidden; transition: box-shadow 0.2s; }
    .class-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .class-card-header { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #f1f3f5; }
    .class-name { font-size: 1.1rem; font-weight: 600; }
    .availability { font-size: 0.8rem; font-weight: 500; padding: 0.25rem 0.6rem; border-radius: 20px; }
    .availability.available { background: #d3f9d8; color: #2b8a3e; }
    .availability.full { background: #ffe3e3; color: #c92a2a; }
    .class-card-body { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .class-detail { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: #495057; }
    .icon { width: 18px; text-align: center; }
    .class-card-footer { padding: 1rem 1.25rem; border-top: 1px solid #f1f3f5; }
    .class-card-footer .btn { width: 100%; }
    .booking-form { background: #fff; border-radius: 12px; border: 1px solid #e9ecef; padding: 2rem; max-width: 480px; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.4rem; color: #495057; }
    .form-input { width: 100%; padding: 0.6rem 0.9rem; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 0.95rem; }
    .form-input:focus { outline: none; border-color: #6c63ff; }
    .session-info { font-size: 0.85rem; color: #6c757d; margin-bottom: 1rem; }
    .status-message { margin-top: 1rem; color: #2b8a3e; font-weight: 500; }
    .bookings-list { display: flex; flex-direction: column; gap: 1rem; }
    .booking-item { background: #fff; border-radius: 12px; border: 1px solid #e9ecef; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .booking-status { font-size: 0.8rem; font-weight: 500; padding: 0.25rem 0.6rem; border-radius: 20px; }
    .status-confirmed { background: #d3f9d8; color: #2b8a3e; }
    .status-cancelled { background: #ffe3e3; color: #c92a2a; }
    .empty-state { text-align: center; padding: 4rem 0; }
    .empty-state p { color: #6c757d; margin-bottom: 1.5rem; }
    .loading { color: #6c757d; text-align: center; padding: 3rem 0; }
    .error-message { background: #fff5f5; border: 1px solid #ffcccc; color: #c92a2a; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
