version = 3.8.6
runner.dialect = scala3

maxColumn = 120
indent.main = 2
indent.significant = 2

align.preset = more
align.tokens.add = [
  { code = "<-" }
  { code = "=>" }
  { code = "%" }
  { code = "%%" }
  { code = "%%%" }
]

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]

newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

docstrings.style = Asterisk
docstrings.wrapMaxColumn = 80
